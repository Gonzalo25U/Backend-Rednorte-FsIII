  server:
    port: 8085

  spring:
    application:
      name: bff-service
    servlet:
      multipart:
        enabled: true
        max-file-size: 10MB
        max-request-size: 10MB

  jwt:
    secret: ${JWT_SECRET}

  gateway:
    url: http://gateway-service:8082

  supabase:
    url: ${SUPABASE_URL}
    anon-key: ${SUPABASE_ANON_KEY}
    service-key: ${SUPABASE_SERVICE_KEY}

  eureka:
    client:
      service-url:
        defaultZone: ${EUREKA_URL:http://eureka-server-service:8761/eureka/}
    instance:
      prefer-ip-address: true