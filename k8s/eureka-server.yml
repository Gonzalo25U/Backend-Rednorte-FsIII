apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: rednorte
  labels:
    app: eureka-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      containers:
      - name: eureka-server
        image: 318533236125.dkr.ecr.us-east-1.amazonaws.com/rednorte/eureka-server:${IMAGE_TAG}
        ports:
        - containerPort: 8761
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server-service
  namespace: rednorte
spec:
  selector:
    app: eureka-server
  ports:
  - port: 8761
    targetPort: 8761