apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: rednorte
  labels:
    app: user-service
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: 318533236125.dkr.ecr.us-east-1.amazonaws.com/rednorte/user-service:${IMAGE_TAG}
        ports:
        - containerPort: 8081
        envFrom:
        - configMapRef:
            name: rednorte-config
        - secretRef:
            name: rednorte-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: rednorte
spec:
  selector:
    app: user-service
  ports:
  - port: 8081
    targetPort: 8081
  type: ClusterIP