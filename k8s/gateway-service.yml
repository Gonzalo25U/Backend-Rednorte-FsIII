apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: rednorte
  labels:
    app: gateway-service
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
      - name: gateway-service
        image: 318533236125.dkr.ecr.us-east-1.amazonaws.com/rednorte/gateway-service:${IMAGE_TAG}
        ports:
        - containerPort: 8082
        envFrom:
        - configMapRef:
            name: rednorte-config
        - secretRef:
            name: rednorte-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: rednorte
spec:
  type: LoadBalancer
  selector:
    app: gateway-service
  ports:
  - port: 80
    targetPort: 8082