services:

  eureka-server:
    build: ./eureka-server
    restart: on-failure
    ports:
      - "8761:8761"

  redis:
    image: redis:7-alpine
    restart: on-failure
    ports:
      - "6379:6379"

  redis-commander:
    image: rediscommander/redis-commander:latest
    restart: on-failure
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8090:8081"
    depends_on:
      - redis

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: on-failure
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest

  user-service:
    build: ./user-service
    restart: on-failure
    ports:
      - "8081:8081"
    depends_on:
      - eureka-server
      - redis
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JAVA_TOOL_OPTIONS=-Djava.net.preferIPv4Stack=false -Djava.net.preferIPv6Addresses=true
    dns:
      - 8.8.8.8
      - 1.1.1.1

  gateway-service:
    build: ./gateway-service
    restart: on-failure
    ports:
      - "8082:8082"
    depends_on:
      - eureka-server

  appointment-service:
    build: ./appointment-service
    restart: on-failure
    ports:
      - "8083:8083"
    depends_on:
      - eureka-server
      - rabbitmq
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
      - JAVA_TOOL_OPTIONS=-Djava.net.preferIPv4Stack=false -Djava.net.preferIPv6Addresses=true
    dns:
      - 8.8.8.8
      - 1.1.1.1

  auth-service:
    build: ./auth-service
    restart: on-failure
    ports:
      - "8084:8084"
    depends_on:
      - eureka-server
    environment:
      - JWT_SECRET=${JWT_SECRET}

  bff-service:
    build: ./bff-service
    restart: on-failure
    ports:
      - "8085:8085"
    depends_on:
      - eureka-server
      - gateway-service
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}

  notification-service:
    build: ./notification-service
    restart: on-failure
    ports:
      - "8086:8086"
    depends_on:
      - eureka-server
      - rabbitmq
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
      - JAVA_TOOL_OPTIONS=-Djava.net.preferIPv4Stack=false -Djava.net.preferIPv6Addresses=true
    dns:
      - 8.8.8.8
      - 1.1.1.1